name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: shellcheck bin/*.sh bin/backends/*.sh tests/*.sh

  tests:
    name: Behavior tests
    runs-on: ubuntu-latest
    # The suite should finish in ~2-3 minutes; this generous cap fails loudly on a
    # hung watcher or tmux test instead of riding GitHub's 360-minute default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require tmux for e2e tests
        run: |
          set -eu
          command -v tmux >/dev/null || {
            echo "::error::tmux is required for real afk injection e2e coverage"
            exit 1
          }
          tmux -V
      - run: |
          set -eu
          for test_script in tests/*.test.sh; do
            "$test_script"
          done

  invariants:
    name: Repo invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Symlinks must stay intact
        run: |
          set -eu
          [ "$(readlink CLAUDE.md)" = "AGENTS.md" ] || { echo "::error::CLAUDE.md must be a symlink to AGENTS.md"; exit 1; }
          [ "$(readlink .claude/skills)" = "../.agents/skills" ] || { echo "::error::.claude/skills must be a symlink to ../.agents/skills"; exit 1; }
      - name: Personal fleet paths must not be tracked
        run: |
          set -eu
          tracked=$(git ls-files -- data state config projects .no-mistakes)
          if [ -n "$tracked" ]; then
            echo "::error::Personal fleet paths are tracked in git:"
            printf '%s\n' "$tracked"
            exit 1
          fi
      - name: AGENTS.md stays within its context budget
        run: |
          set -eu
          # AGENTS.md loads on every session of every fleet member, so its size is a
          # per-session cost paid whether or not a session hits the situation new lines
          # describe. Deliberate slimming took it from ~114KB to ~56KB; this budget stops
          # silent regrowth. Do NOT clear a failure by deleting load-bearing text: route
          # the detail to its owner per the firstmate-coding-guidelines skill (mechanism
          # -> bin/ script headers, reference -> docs/, situational detail -> an agent-only
          # skill under .agents/skills/ with a one-line trigger left in AGENTS.md). Raise
          # the budget deliberately, in its own commit, only when the added lines genuinely
          # must be resident on every turn.
          budget=60000
          size=$(wc -c < AGENTS.md)
          if [ "$size" -gt "$budget" ]; then
            echo "::error file=AGENTS.md::AGENTS.md is ${size} bytes, over the ${budget}-byte context budget (over by $((size - budget))). Route detail to bin/ headers, docs/, or an agent-only skill instead of deleting it; see the firstmate-coding-guidelines skill."
            exit 1
          fi
          echo "AGENTS.md ${size}/${budget} bytes ($((budget - size)) headroom)"
